name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('smolvm-core/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      # Install smolvm (creates .venv)
      - name: Install smolvm
        run: uv sync --extra dev

      # Build smolvm-core into the same venv
      - name: Build smolvm-core
        run: |
          uv pip install maturin
          cd smolvm-core
          VIRTUAL_ENV=${{ github.workspace }}/.venv maturin develop --release

      - name: Assert native extension available
        run: |
          uv run python -c "
          from smolvm._accel import HAS_NETLINK
          assert HAS_NETLINK, 'smolvm-core not loaded'
          from smolvm_core import is_available
          assert is_available(), 'Native extension reports not available on Linux'
          print('smolvm-core: OK')
          "

      - name: Run pytest
        run: uv run pytest
