name: OpenMuse example

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: |
            ts/package-lock.json
            examples/open-muse/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: npm run build
        working-directory: ts
      - run: npm ci
        working-directory: examples/open-muse
      - run: npm run check
        working-directory: examples/open-muse
      - run: npx playwright install --with-deps chromium
        working-directory: examples/open-muse
      - run: npm run test:e2e
        working-directory: examples/open-muse
      - run: npm run eval:artifact
        working-directory: examples/open-muse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-muse-test-artifacts
          path: |
            examples/open-muse/artifacts/open-muse-eval.json
            examples/open-muse/artifacts/playwright-report
            examples/open-muse/artifacts/playwright-results
          if-no-files-found: ignore
          retention-days: 14
